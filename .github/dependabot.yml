version: 2
updates:
  # Propose updates for review; this does not enable automatic merging.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "gomod"
    directory: "/mockserver"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
